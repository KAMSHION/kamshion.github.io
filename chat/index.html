<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简聊天室</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登录/注册界面 -->
  <div id="auth-panel">
    <h2>欢迎来到聊天室</h2>
    <input type="text" id="username" placeholder="用户名" maxlength="10">
    <input type="password" id="password" placeholder="密码">
    <div class="btn-group">
      <button onclick="login()">登录</button>
      <button onclick="register()">注册</button>
    </div>
    <p id="auth-msg"></p>
  </div>

  <!-- 聊天界面 (默认隐藏) -->
  <div id="chat-panel" style="display: none;">
    <div id="header">
      <span>在线聊天室</span>
      <button id="logout-btn" onclick="logout()">退出</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="msg-input" placeholder="输入消息 (300字以内)..." maxlength="300"></textarea>
      <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
