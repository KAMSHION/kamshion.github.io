<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邮箱验证码</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .row { margin-bottom: 12px; }
        input, button { padding: 8px; border-radius: 4px; border: 1px solid #aaa; }
        button {
            cursor: pointer;
            background: #0078d4;
            color: white;
            border: none;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #msg, #timer { min-height: 1.5em; margin-top: 8px; }
        .error { color: #d9534f; }
        .success { color: #2b6f2b; }
        .info { color: #31708f; }
    </style>
</head>
<body>

    <h3>邮箱验证码</h3>
    <p>输入邮箱，系统将先检查有效性，通过后再发送验证码</p>

    <div class="row">
        <input type="email" id="emailInput" placeholder="your@email.com" style="width:70%;" />
        <button id="sendBtn" onclick="handleSend()">发送</button>
    </div>

    <div class="row">
        <input type="text" id="codeInput" placeholder="输入验证码" style="width:70%;" />
        <button onclick="verify()">验证</button>
    </div>

    <div id="msg"></div>
    <div id="timer"></div>

    <script>
        // EmailJS 配置
        const SERVICE_ID = 'service_j4bucqo';
        const TEMPLATE_ID = 'template_o1cztjg';
        const PUBLIC_KEY = 'rGEorGcHSG7qUCue9';
        emailjs.init(PUBLIC_KEY);

        // 极数本源邮箱检测 API Key
        const EMAIL_CHECK_API_KEY = 'sk_stag_36e46cf0a9a0f84f82c29bbb2f755a05632bc20dbe3da791';

        let currentCode = '';
        let codeTimestamp = 0;
        let cooldownTimer = null;
        const COOLDOWN_SECONDS = 300;

        const sendBtn = document.getElementById('sendBtn');
        const emailInput = document.getElementById('emailInput');
        const msgEl = document.getElementById('msg');
        const timerEl = document.getElementById('timer');

        function showMsg(text, type) {
            msgEl.textContent = text;
            msgEl.className = type || '';
        }

        async function handleSend() {
            const email = emailInput.value.trim();
            if (!email) {
                alert('请输入邮箱地址');
                return;
            }
            if (sendBtn.disabled) {
                alert('请等待倒计时结束再试');
                return;
            }

            showMsg('正在检查邮箱有效性...', 'info');
            sendBtn.disabled = true;

            try {
                const checkUrl = `https://v1.apizero.cn/api/email-check?email=${encodeURIComponent(email)}&key=${EMAIL_CHECK_API_KEY}`;
                const response = await fetch(checkUrl, { timeout: 15000 });
                const result = await response.json();

                if (result.code !== 0) {
                    showMsg('邮箱检查服务异常：' + (result.msg || '未知错误'), 'error');
                    sendBtn.disabled = false;
                    return;
                }

                const data = result.data;
                const isValid = data.valid_format === true && data.has_mx === true;
                const isRisky = data.risk_level === 'invalid' || data.risk_level === 'high';

                if (!isValid || isRisky) {
                    let reasonText = '该邮箱无法接收验证码，原因如下：\n';
                    if (data.reasons && data.reasons.length) {
                        reasonText += data.reasons.join('\n');
                    } else {
                        reasonText += '格式无效或 MX 记录不存在';
                    }
                    if (data.spelling_suggestion) {
                        reasonText += '\n建议使用：' + data.spelling_suggestion;
                    }
                    showMsg(reasonText, 'error');
                    sendBtn.disabled = false;
                    return;
                }

                currentCode = Math.floor(100000 + Math.random() * 900000).toString();
                codeTimestamp = Date.now();

                await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                    to_email: email,
                    code: currentCode
                });

                showMsg('验证码已发送至邮箱（请检查垃圾箱）', 'success');
                startCooldown();

            } catch (err) {
                console.error(err);
                showMsg('请求失败，请检查网络或稍后重试', 'error');
                sendBtn.disabled = false;
            }
        }

        function startCooldown() {
            sendBtn.disabled = true;
            let remaining = COOLDOWN_SECONDS;
            timerEl.textContent = '请等待 ' + remaining + ' 秒后重试';
            if (cooldownTimer) clearInterval(cooldownTimer);
            cooldownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(cooldownTimer);
                    cooldownTimer = null;
                    timerEl.textContent = '';
                    sendBtn.disabled = false;
                } else {
                    timerEl.textContent = '请等待 ' + remaining + ' 秒后重试';
                }
            }, 1000);
        }

        function verify() {
            const input = document.getElementById('codeInput').value.trim();
            if (!input) {
                alert('请输入验证码');
                return;
            }
            const now = Date.now();
            const elapsed = (now - codeTimestamp) / 1000;
            if (elapsed > COOLDOWN_SECONDS) {
                alert('验证码已过期（超过5分钟），请重新获取');
                currentCode = '';
                return;
            }
            if (input === currentCode) {
                alert('验证通过');
                currentCode = '';
            } else {
                alert('验证码错误');
            }
        }
    </script>
</body>
</html>
